<!DOCTYPE html>
<html lang="en" class="lenis lenis-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Taylor</title>
    <meta
      name="description"
      content="Get in touch with Taylor for brand, web, and art direction projects."
    />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body id="top" class="page--dark">
    <header class="nav" data-theme="light-on-dark">
      <a class="nav__logo" href="../">Taylor ®</a>
      <div class="nav__clock" aria-live="polite">
        NY : <span id="ny-time">--:--</span>
      </div>
      <nav class="nav__links" aria-label="Primary">
        <a href="../work/">Works</a>
        <a href="../about/">About</a>
        <a href="../blog/">Blog</a>
      </nav>
      <a class="nav__contact" href="./">Contact</a>
      <button class="nav__menu" type="button" aria-label="Open menu">Menu</button>
    </header>

    <div class="nav__drawer" aria-hidden="true">
      <button class="nav__drawer-close" type="button">Close</button>
      <nav class="nav__drawer-links" aria-label="Mobile">
        <a href="../work/">Works</a>
        <a href="../about/">About</a>
        <a href="../blog/">Blog</a>
        <a href="./">Contact</a>
      </nav>
    </div>

    <main class="contact-page">
      <header class="page-hero page-hero--dark">
        <h1 class="page-hero__title">Get in touch</h1>
      </header>

      <form class="contact-form" data-contact-form novalidate>
        <div class="contact-form__row">
          <div class="contact-form__field">
            <label for="firstName">First name</label>
            <input
              id="firstName"
              name="firstName"
              type="text"
              placeholder="taylor"
              autocomplete="given-name"
              required
            />
          </div>
          <div class="contact-form__field">
            <label for="lastName">Last name</label>
            <input
              id="lastName"
              name="lastName"
              type="text"
              placeholder="barbara"
              autocomplete="family-name"
            />
          </div>
        </div>

        <div class="contact-form__field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="taylor@gmail.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="contact-form__field">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Enter your message..."
            required
          ></textarea>
        </div>

        <button class="contact-form__submit" type="submit">Submit</button>
        <p class="contact-form__status" data-contact-status aria-live="polite"></p>
      </form>
    </main>

    <footer class="footer">
      <div class="footer__brand">
        <a class="footer__logo" href="../">Taylor ®</a>
        <p class="footer__credit">Akin X Ed © 2026</p>
      </div>
      <nav class="footer__nav" aria-label="Footer">
        <a href="../">Home</a>
        <a href="../work/">Work</a>
        <a href="../about/">About</a>
        <a href="../blog/">Blog</a>
        <a href="./">Contact</a>
      </nav>
      <nav class="footer__nav" aria-label="Social">
        <a href="https://www.behance.net/" target="_blank" rel="noopener"
          >Behance</a
        >
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener"
          >Linkedin</a
        >
        <a href="https://www.x.com/" target="_blank" rel="noopener"
          >X(Twitter)</a
        >
      </nav>
      <a class="footer__back" href="#top" data-back-to-top>Back to top</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
